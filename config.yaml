
# Capstone Multimodal Recommender — single source of truth.
# Every script reads its parameters from here. Never hardcode these values.

project:
  name: capstone_multimodal_rec
  root: /home/mncedisi/capstone_multimodal_rec

paths:
  raw_data: data/raw
  processed_data: data/processed
  images: data/images
  features: features
  checkpoints: checkpoints
  results: results
  logs: logs
  reports: reports
  demo: demo

seeds:
  split_construction: 42    # frozen after Phase 1 validation — never change silently
  development: 1337         # single seed used for all tuning
  statistical: [1, 2, 3, 4, 5]   # locked-configuration runs only

data:
  category: Electronics
  domains: [laptops_tablets, audio, wearables, computer_accessories, camera_photo]
  min_domains_per_user: 3        # relax to 2 only if the feasibility probe demands it
  min_interactions_per_item: 5
  min_interactions_per_user: 5   # ensures >=3 remain in training after leave-one-out
  corpus_size_min: 5000
  corpus_size_max: 7000
  ghost_fraction: 0.20
  ghost_min_interactions: 5


sources:
  # 0-core ratings-only export: user_id, parent_asin, rating, timestamp.
  # 0-core NOT 5-core — 5-core pre-filters at >=5 interactions, which would
  # invalidate the feasibility probe's threshold comparison.
  # Already keyed on parent_asin, so the asin/parent_asin trap cannot bite here.
  interactions_url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/benchmark/0core/rating_only/Electronics.csv.gz
  interactions_file: Electronics_ratings.csv.gz
  # Item metadata: titles, features, descriptions, image URLs. No lightweight
  # export exists — this is the heavy download, streamed exactly once.
  metadata_url: https://datarepo.eng.ucsd.edu/mcauley_group/data/amazon_2023/raw/meta_categories/meta_Electronics.jsonl.gz
  metadata_file: meta_Electronics.jsonl.gz
  # Recorded for the filtering report, per manual section 1.3.
  interactions_source_type: ratings_only_0core

domain_keywords:
  # Case-insensitive partial matching against flattened category fields.
  laptops_tablets: [laptop, notebook computer, tablet, ipad, chromebook, macbook, 2-in-1, ultrabook]
  audio: [headphone, headset, earbud, earphone, speaker, soundbar, audio, amplifier, microphone, turntable]
  wearables: [smartwatch, smart watch, fitness tracker, wearable, activity tracker, fitness band, smart band]
  computer_accessories: [keyboard, mouse, monitor, mousepad, docking station, usb hub, webcam, printer, external drive, laptop stand, sleeve, case, bag, cable, adapter, charger]
  camera_photo: [camera, dslr, mirrorless, camera lens, tripod, camcorder, photography, flash, gimbal]

# Applied when an item matches more than one domain. Accessory terms are
# resolved BEFORE the device terms so that, e.g., a "laptop sleeve" is an
# accessory rather than a laptop. Revisit after the section 1.4 title audit.
domain_priority: [camera_photo, wearables, audio, computer_accessories, laptops_tablets]


features:
  clip_model: openai/clip-vit-base-patch32
  clip_dim: 512
  sbert_model: sentence-transformers/all-mpnet-base-v2
  sbert_dim: 768              # all-mpnet-base-v2 is 768, NOT 384
  image_size: 224
  extraction_batch_size: 64
  use_fp16: true

model:
  embedding_dim: 64
  fusion_dim: 128
  attention_heads: 4
  dropout: 0.5
  mlp_layers: [128, 64, 32]

training:
  batch_size: 256             # reduce here first if memory pressure appears
  learning_rate: 0.001
  weight_decay: 0.00001
  num_negatives: 4
  max_epochs: 100
  early_stopping_patience: 10

evaluation:
  k: 10
  metrics: [ndcg, hit_rate, mrr, coverage]   # Precision@10 excluded — degenerate under leave-one-out
  conditions: [control, blind, silent, ghost]
  scoring_batch_size: 512
  exclude_user_train_items: true             # standard protocol — do not omit