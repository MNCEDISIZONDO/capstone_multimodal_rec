# Capstone Multimodal Recommender — single source of truth.
# Every script reads its parameters from here. Never hardcode these values.

project:
  name: capstone_multimodal_rec
  root: /home/mncedisi/capstone_multimodal_rec

paths:
  raw_data: data/raw
  processed_data: data/processed
  images: data/images
  features: features
  checkpoints: checkpoints
  results: results
  logs: logs
  reports: reports
  demo: demo

seeds:
  split_construction: 42    # frozen after Phase 1 validation — never change silently
  development: 1337         # single seed used for all tuning
  statistical: [1, 2, 3, 4, 5]   # locked-configuration runs only

data:
  category: Electronics
  domains: [laptops_tablets, audio, wearables, computer_accessories, camera_photo]
  # Confirmed by the feasibility probe: 111,270 users satisfy the three-domain
  # constraint, so the relaxed two-domain fallback is not required.
  min_domains_per_user: 3
  # Selected from the threshold sensitivity analysis (reports/threshold_sweep.csv).
  # A stricter floor of 10 yielded only 3,995 items, below the corpus target.
  min_interactions_per_item: 7
  min_interactions_per_user: 5   # ensures >=3 remain in training after leave-one-out
  corpus_size_min: 5000
  corpus_size_max: 10000
  ghost_fraction: 0.20
  ghost_min_interactions: 5

sources:
  # 0-core ratings-only export: user_id, parent_asin, rating, timestamp.
  # 0-core NOT 5-core — the 5-core release pre-filters at five interactions,
  # which would invalidate any threshold comparison performed downstream.
  # Already keyed on parent_asin, so product variants are correctly unified.
  interactions_url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/benchmark/0core/rating_only/Electronics.csv.gz
  interactions_file: Electronics_ratings.csv.gz
  # Item metadata: titles, features, descriptions, image URLs.
  # The URL published on the HuggingFace dataset card (datarepo.eng.ucsd.edu)
  # was unreachable as of July 2026; mcauleylab.ucsd.edu is the live host.
  metadata_url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_Electronics.jsonl.gz
  metadata_file: meta_Electronics.jsonl.gz
  interactions_source_type: ratings_only_0core

# Domain assignment operates on the hierarchical `categories` path, which runs
# broad to specific. Three stages, applied in order:
#   1. LEAF veto      — the last path token identifies what the item is.
#   2. TITLE veto     — catches accessories filed under a device leaf.
#   3. TITLE require  — the title must contain a domain-relevant term.
# Stage 3 is the robust stage: the source metadata contains outright
# misclassifications that no category rule can anticipate but which fail an
# affirmative title test immediately. Over-rejection is acceptable because the
# in-scope pool greatly exceeds the corpus requirement.
domain_rules:
  # Matched as substrings against the LEAF token only. Matching against ancestor
  # tokens would reject the entire catalogue, since 'computers & accessories' is
  # the common ancestor of both laptops and laptop bags.
  exclude_contains:
    - accessor
    - replacement part
    - parts & components
    - case
    - sleeve
    - bag
    - cable
    - adapter
    - charger
    - batter
    - screen protector
    - skin
    - decal
    - mount
    - stand
    - monitor arms
    - wristband
    - cooling
    - remote control
    - kit
    - strap
    - holder
    - cover

  # Matched as substrings against the TITLE. Deliberately narrow: a broad
  # phrase such as "compatible with" would reject legitimate products.
  exclude_title_contains:
    - watch band
    - watch bands
    - watchband
    - silicone band
    - replacement band
    - bands for
    - band for
    - sport band
    - accessory band
    - ankle band
    - band compatible
    - wrist strap
    - travel case
    - carrying case
    - hard case
    - case for
    - case fits
    - keyboard case
    - charging cable
    - charger cable
    - usb charger
    - screen protector
    - selfie stick
    - replacement for
    - keycap
    - glove
    - bracket
    - for arduino

  # The title must contain at least one term for the assigned domain.
  require_title_contains:
    laptops_tablets: [laptop, notebook, tablet, chromebook, macbook, ultrabook, ipad, thinkpad]
    audio: [headphone, earbud, earphone, speaker, soundbar, headset, subwoofer, earpiece]
    wearables: [watch, tracker, wearable, fitbit, garmin, smart band]
    computer_accessories: [keyboard, mouse, mice, monitor, webcam, hub, dock, display, keypad]
    camera_photo: [camera, lens, tripod, camcorder, dslr, monopod]

  # Device-level leaf tokens defining each domain. Desktops are excluded from
  # laptops_tablets because the domain covers portable computing; surveillance
  # and vehicle cameras are excluded from camera_photo because they are security
  # and automotive products rather than consumer photography. Tripods are
  # retained despite the general accessory exclusion, because the exclusion
  # targets low-signal items (cables, cases) whereas tripods carry distinctive
  # visual and textual content.
  include_exact:
    laptops_tablets:
      [laptops, traditional laptops, 2 in 1 laptops, gaming laptops,
       tablets, graphics tablets]
    audio:
      [headphones & earbuds, earbud headphones, over-ear headphones,
       on-ear headphones, speakers, portable bluetooth speakers,
       computer speakers, headsets & microphones, soundbar, soundbars]
    wearables:
      [smartwatches, wearable technology,
       "wearable technology: running watches & devices",
       "wearable technology: smart tracking",
       "wearable technology: fitness & wellness"]
    computer_accessories:
      [keyboards, mice, keyboard & mouse combos, monitors, webcams,
       usb hubs, hubs, docking stations]
    camera_photo:
      [digital cameras, point & shoot digital cameras, camcorders,
       lenses, camera lenses, slr camera lenses,
       tripods & monopods, complete tripods]

# Tie-breaker when an item matches tokens from more than one domain. No item in
# the source data matched multiple domains, since include_exact uses mutually
# exclusive device-level tokens; retained as a safeguard.
domain_priority: [wearables, laptops_tablets, audio, computer_accessories, camera_photo]

images:
  min_bytes: 2000         # smaller responses are typically error pages or placeholders
  min_pixels: 64          # below this an image carries no usable visual signal
  max_workers: 8
  timeout_seconds: 20
  max_retries: 3

features:
  clip_model: openai/clip-vit-base-patch32
  clip_dim: 512
  sbert_model: sentence-transformers/all-mpnet-base-v2
  sbert_dim: 768              # all-mpnet-base-v2 produces 768 dimensions
  image_size: 224
  extraction_batch_size: 64
  use_fp16: true

model:
  embedding_dim: 64
  fusion_dim: 128             # must be divisible by attention_heads
  attention_heads: 4
  dropout: 0.5
  mlp_layers: [128, 64, 32]
  # The two encoders emit vectors on different numerical scales (measured mean
  # norms of 10.3 and 1.0). Without per-modality normalisation the larger-scale
  # modality dominates the fused representation from initialisation for reasons
  # of magnitude rather than information content, which would confound the
  # ablation study. Applied identically across all variants so that comparisons
  # remain fair.
  modality_normalisation: layernorm
  # Every item present in training has a collaborative representation, so a
  # model trained without intervention never encounters the condition it must
  # handle at cold-start inference. Randomly suppressing the collaborative
  # signal during training exposes the model to that condition while it can
  # still learn from it.
  collaborative_dropout: 0.2


training:
  batch_size: 256             # reduce here first if memory pressure appears
  learning_rate: 0.001
  weight_decay: 0.00001
  num_negatives: 4
  max_epochs: 100
  early_stopping_patience: 10
  # Validation during training ranks a sample of users against the full
  # catalogue rather than against sampled negatives, so the early-stopping
  # signal is not distorted by the sampling bias that affects sampled metrics.
  # A sample of users keeps the per-epoch cost low enough for the number of
  # runs the experimental protocol requires; final evaluation uses every user.
  validation_users: 1000
  validation_chunk_users: 64

evaluation:
  k: 10
  # Precision@10 is excluded: under leave-one-out evaluation with a single
  # relevant item per user it equals HR@10 divided by ten and adds no information.
  metrics: [ndcg, hit_rate, mrr, coverage]
  conditions: [control, blind, silent, ghost]
  scoring_batch_size: 512
  exclude_user_train_items: true