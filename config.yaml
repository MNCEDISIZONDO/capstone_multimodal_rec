# Capstone Multimodal Recommender — single source of truth.
# Every script reads its parameters from here. Never hardcode these values.

project:
  name: capstone_multimodal_rec
  root: /home/mncedisi/capstone_multimodal_rec

paths:
  raw_data: data/raw
  processed_data: data/processed
  images: data/images
  features: features
  checkpoints: checkpoints
  results: results
  logs: logs
  reports: reports
  demo: demo

seeds:
  split_construction: 42    # frozen after Phase 1 validation — never change silently
  development: 1337         # single seed used for all tuning
  statistical: [1, 2, 3, 4, 5]   # locked-configuration runs only

data:
  category: Electronics
  domains: [laptops_tablets, audio, wearables, computer_accessories, camera_photo]
  min_domains_per_user: 3        # relax to 2 only if the feasibility probe demands it
  min_interactions_per_item: 10
  min_interactions_per_user: 5   # ensures >=3 remain in training after leave-one-out
  corpus_size_min: 5000
  corpus_size_max: 7000
  ghost_fraction: 0.20
  ghost_min_interactions: 5

sources:
  # 0-core ratings-only export: user_id, parent_asin, rating, timestamp.
  # 0-core NOT 5-core — 5-core pre-filters at >=5 interactions, which would
  # invalidate the feasibility probe's threshold comparison.
  # Already keyed on parent_asin, so the asin/parent_asin trap cannot bite here.
  interactions_url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/benchmark/0core/rating_only/Electronics.csv.gz
  interactions_file: Electronics_ratings.csv.gz
  # Item metadata: titles, features, descriptions, image URLs. No lightweight
  # export exists — this is the heavy download, streamed exactly once.
  # NOTE: the URL published on the HuggingFace dataset card (datarepo.eng.ucsd.edu)
  # was dead as of July 2026; mcauleylab.ucsd.edu is the live host.
  metadata_url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_Electronics.jsonl.gz
  metadata_file: meta_Electronics.jsonl.gz
  # Recorded for the filtering report, per manual section 1.3.
  interactions_source_type: ratings_only_0core

# Domain assignment operates on the hierarchical `categories` path, which runs
# broad to specific. Three stages, applied in order:
#   1. LEAF veto      — the last path token is what the item IS.
#   2. TITLE veto     — catches accessories filed under the device leaf.
#   3. TITLE require  — the title must contain a domain-relevant term.
# Stage 3 is the robust one: Amazon's metadata contains outright errors (a
# toothbrush filed under 'speakers') that no category rule catches. Asymmetry
# is deliberate — 217k items survive stage 1 and only ~7k are needed, so
# over-rejecting is free while under-rejecting corrupts the corpus.
domain_rules:
  # Stage 1. Matched as substrings against the LEAF token only. Vetoing on
  # ancestors would reject the whole catalogue, since 'computers & accessories'
  # is the ancestor of both laptops and laptop bags.
  exclude_contains:
    - accessor
    - replacement part
    - parts & components
    - case
    - sleeve
    - bag
    - cable
    - adapter
    - charger
    - batter            # battery, batteries
    - screen protector
    - skin
    - decal
    - mount
    - stand
    - monitor arms      # not "arm" — that also matched "alarm"
    - wristband
    - cooling
    - remote control
    - kit
    - strap
    - holder
    - cover

  # Stage 2. Matched as substrings against the TITLE. Deliberately narrow —
  # "compatible with" alone would reject legitimate products such as
  # "Smart Watch Compatible with iPhone".
  exclude_title_contains:
    - watch band
    - watch bands
    - watchband
    - silicone band
    - replacement band
    - bands for
    - band for
    - wrist strap
    - travel case
    - carrying case
    - hard case
    - case for
    - case fits
    - keyboard case
    - charging cable
    - charger cable
    - usb charger
    - screen protector
    - selfie stick
    - replacement for
    - keycap
    - glove
    - bracket
    - for arduino
    - sport band
    - accessory band
    - ankle band
    - band compatible

  # Stage 3. The title must contain at least one of these terms for the
  # assigned domain, or the item is dropped.
  require_title_contains:
    laptops_tablets: [laptop, notebook, tablet, chromebook, macbook, ultrabook, ipad, thinkpad]
    audio: [headphone, earbud, earphone, speaker, soundbar, headset, subwoofer, earpiece]
    wearables: [watch, tracker, wearable, fitbit, garmin, smart band]
    computer_accessories: [keyboard, mouse, mice, monitor, webcam, hub, dock, display, keypad]
    camera_photo: [camera, lens, tripod, camcorder, dslr, monopod]

  # Exact leaf tokens that define each domain. Devices only — desktops and
  # surveillance/dash cameras are deliberately excluded to keep the domains
  # semantically coherent (portable computing; consumer photography).
  include_exact:
    laptops_tablets:
      [laptops, traditional laptops, 2 in 1 laptops, gaming laptops,
       tablets, graphics tablets]
    audio:
      [headphones & earbuds, earbud headphones, over-ear headphones,
       on-ear headphones, speakers, portable bluetooth speakers,
       computer speakers, headsets & microphones, soundbar, soundbars]
    wearables:
      [smartwatches, wearable technology,
       "wearable technology: running watches & devices",
       "wearable technology: smart tracking",
       "wearable technology: fitness & wellness"]
    computer_accessories:
      [keyboards, mice, keyboard & mouse combos, monitors, webcams,
       usb hubs, hubs, docking stations]
    camera_photo:
      [digital cameras, point & shoot digital cameras, camcorders,
       lenses, camera lenses, slr camera lenses,
       tripods & monopods, complete tripods]

# Tie-breaker when an item matches tokens from more than one domain.
# EMPIRICAL FINDING: zero items matched >1 domain, because include_exact uses
# device-level leaf tokens which are mutually exclusive. Retained as a
# documented safeguard rather than deleted.
domain_priority: [wearables, laptops_tablets, audio, computer_accessories, camera_photo]

features:
  clip_model: openai/clip-vit-base-patch32
  clip_dim: 512
  sbert_model: sentence-transformers/all-mpnet-base-v2
  sbert_dim: 768              # all-mpnet-base-v2 is 768, NOT 384
  image_size: 224
  extraction_batch_size: 64
  use_fp16: true

model:
  embedding_dim: 64
  fusion_dim: 128
  attention_heads: 4
  dropout: 0.5
  mlp_layers: [128, 64, 32]

training:
  batch_size: 256             # reduce here first if memory pressure appears
  learning_rate: 0.001
  weight_decay: 0.00001
  num_negatives: 4
  max_epochs: 100
  early_stopping_patience: 10

evaluation:
  k: 10
  metrics: [ndcg, hit_rate, mrr, coverage]   # Precision@10 excluded — degenerate under leave-one-out
  conditions: [control, blind, silent, ghost]
  scoring_batch_size: 512
  exclude_user_train_items: true             # standard protocol — do not omit